<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="868" viewBox="0 0 1240 868" font-family="system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 12 10" refX="11" refY="5" markerWidth="8" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L12,5 L0,10 z" fill="#5F6368"/>
    </marker>
  </defs>

  <rect width="1240" height="868" fill="#FFFFFF"/>

  <!-- title -->
  <text x="620" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#202124">Chronotope（时空可组合持久运行时）· MVP 架构图（v3）</text>
  <text x="620" y="66" text-anchor="middle" font-size="13" fill="#5F6368">布局：左侧主链路（提交 → 持久执行 → harness → 沙箱），右侧数据与执行空间，底部外部系统</text>

  <!-- ============ clients ============ -->
  <rect x="60" y="92" width="270" height="100" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="195" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1A73E8">用户 / 开发者</text>
  <text x="195" y="142" text-anchor="middle" font-size="11" fill="#5F6368">SDK · CLI · REST · MCP</text>

  <rect x="370" y="92" width="270" height="100" rx="10" fill="#E8F0FE" stroke="#1A73E8" stroke-width="1.5"/>
  <text x="505" y="120" text-anchor="middle" font-size="14" font-weight="700" fill="#1A73E8">控制台 Web · Next.js</text>
  <text x="505" y="142" text-anchor="middle" font-size="11" fill="#5F6368">时间轴回放 · 会话管理 · 用量</text>

  <!-- ============ api ============ -->
  <rect x="60" y="252" width="700" height="100" rx="10" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1.5"/>
  <text x="410" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#1E8E3E">api · Go</text>
  <text x="410" y="308" text-anchor="middle" font-size="11" fill="#3C4043">REST + SSE · Agent/Session 管理 · 事件投影 · 计量 · outbox · 幂等键</text>

  <!-- ============ durability ============ -->
  <rect x="60" y="412" width="340" height="110" rx="10" fill="#FEF7E0" stroke="#E37400" stroke-width="1.5"/>
  <text x="230" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#E37400">worker · Go（Restate 端点）</text>
  <text x="230" y="468" text-anchor="middle" font-size="11" fill="#3C4043">session_object · run_workflow</text>
  <text x="230" y="488" text-anchor="middle" font-size="11" fill="#3C4043">scheduler(cron) · webhook(HITL)</text>

  <rect x="430" y="412" width="330" height="110" rx="10" fill="#FEF7E0" stroke="#E37400" stroke-width="1.5"/>
  <text x="595" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#E37400">Restate 引擎（单二进制）</text>
  <text x="595" y="468" text-anchor="middle" font-size="11" fill="#3C4043">事件日志 · journal 重放 · 输出缓存</text>
  <text x="595" y="488" text-anchor="middle" font-size="11" fill="#3C4043">durable timer · awakeable</text>

  <!-- ============ intelligence / execution ============ -->
  <rect x="60" y="582" width="220" height="110" rx="10" fill="#FCE8E6" stroke="#D93025" stroke-width="1.5"/>
  <text x="170" y="612" text-anchor="middle" font-size="14" font-weight="700" fill="#D93025">harness · Python</text>
  <text x="170" y="636" text-anchor="middle" font-size="11" fill="#3C4043">无状态 agent loop</text>
  <text x="170" y="656" text-anchor="middle" font-size="11" fill="#3C4043">OpenAI Agents SDK</text>

  <rect x="310" y="582" width="160" height="110" rx="10" fill="#FCE8E6" stroke="#D93025" stroke-width="1.5"/>
  <text x="390" y="612" text-anchor="middle" font-size="14" font-weight="700" fill="#D93025">LiteLLM</text>
  <text x="390" y="636" text-anchor="middle" font-size="11" fill="#3C4043">多模型网关</text>
  <text x="390" y="656" text-anchor="middle" font-size="11" fill="#3C4043">密钥/路由/用量</text>

  <rect x="500" y="582" width="260" height="110" rx="10" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1.5"/>
  <text x="630" y="612" text-anchor="middle" font-size="14" font-weight="700" fill="#1E8E3E">executor · Go</text>
  <text x="630" y="636" text-anchor="middle" font-size="11" fill="#3C4043">execute(name, input) 协议</text>
  <text x="630" y="656" text-anchor="middle" font-size="11" fill="#3C4043">工具路由 · 沙箱编排</text>

  <!-- ============ data stores ============ -->
  <rect x="830" y="252" width="370" height="110" rx="10" fill="#F3E8FD" stroke="#9334E6" stroke-width="1.5"/>
  <text x="1015" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#9334E6">Postgres 16</text>
  <text x="1015" y="308" text-anchor="middle" font-size="11" fill="#3C4043">events（append-only）· sessions · usage</text>
  <text x="1015" y="328" text-anchor="middle" font-size="11" fill="#3C4043">outbox · pgvector（长期记忆）</text>

  <rect x="830" y="412" width="370" height="100" rx="10" fill="#F3E8FD" stroke="#9334E6" stroke-width="1.5"/>
  <text x="1015" y="442" text-anchor="middle" font-size="15" font-weight="700" fill="#9334E6">MinIO（S3 兼容）</text>
  <text x="1015" y="468" text-anchor="middle" font-size="11" fill="#3C4043">工件 · 文件 · 会话快照</text>

  <rect x="830" y="582" width="370" height="110" rx="10" fill="#E6F4EA" stroke="#1E8E3E" stroke-width="1.5"/>
  <text x="1015" y="612" text-anchor="middle" font-size="14" font-weight="700" fill="#1E8E3E">沙箱（自托管）</text>
  <text x="1015" y="636" text-anchor="middle" font-size="11" fill="#3C4043">dev：Docker executor（受限容器）</text>
  <text x="1015" y="656" text-anchor="middle" font-size="11" fill="#3C4043">prod：E2B · Firecracker 微VM</text>

  <!-- ============ external ============ -->
  <rect x="60" y="752" width="420" height="78" rx="10" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.5"/>
  <text x="270" y="780" text-anchor="middle" font-size="14" font-weight="700" fill="#3C4043">模型厂商</text>
  <text x="270" y="802" text-anchor="middle" font-size="11" fill="#5F6368">OpenAI 兼容端点 · Anthropic（统一经 LiteLLM）</text>

  <rect x="520" y="752" width="420" height="78" rx="10" fill="#F1F3F4" stroke="#5F6368" stroke-width="1.5"/>
  <text x="730" y="780" text-anchor="middle" font-size="14" font-weight="700" fill="#3C4043">外部事件</text>
  <text x="730" y="802" text-anchor="middle" font-size="11" fill="#5F6368">Webhook · HITL 审批 · 定时触发</text>

  <!-- ============ arrows ============ -->
  <g stroke="#5F6368" stroke-width="1.5" fill="none" marker-end="url(#arr)">
    <line x1="195" y1="192" x2="195" y2="252"/>
    <line x1="505" y1="192" x2="505" y2="252"/>
    <line x1="230" y1="352" x2="230" y2="412"/>
    <line x1="400" y1="467" x2="430" y2="467"/>
    <line x1="150" y1="522" x2="150" y2="582"/>
    <line x1="280" y1="637" x2="310" y2="637"/>
    <line x1="390" y1="692" x2="390" y2="752"/>
    <line x1="550" y1="522" x2="550" y2="582"/>
    <line x1="760" y1="637" x2="830" y2="637"/>
    <line x1="760" y1="302" x2="830" y2="302"/>
    <polyline points="760,652 795,652 795,462 830,462"/>
    <polyline points="680,752 680,700 810,700 810,322 760,322"/>
  </g>

  <!-- arrow labels -->
  <g font-size="11" fill="#3C4043">
    <text x="205" y="226">建 Agent/Session · 提交任务</text>
    <text x="515" y="226">SSE 时间轴 · 用量</text>
    <text x="240" y="386">提交 run（幂等键）</text>
    <text x="372" y="458" text-anchor="end">journal / state</text>
    <text x="160" y="556">POST /runs → SSE（幂等）</text>
    <text x="295" y="626" text-anchor="middle">OpenAI 协议</text>
    <text x="402" y="726">多模型调用（OpenAI 兼容 + Anthropic）</text>
    <text x="560" y="556">代码/命令工具</text>
    <text x="772" y="657">容器/微VM 生命周期</text>
    <text x="764" y="292">事件 · 元数据 · 用量</text>
    <text x="800" y="548">工件</text>
    <text x="700" y="716">webhook 唤醒 · resolve awakeable</text>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#3C4043">
    <rect x="260" y="846" width="14" height="14" rx="3" fill="#E8F0FE" stroke="#1A73E8"/>
    <text x="280" y="858">客户端</text>
    <rect x="340" y="846" width="14" height="14" rx="3" fill="#E6F4EA" stroke="#1E8E3E"/>
    <text x="360" y="858">Go 平台/执行</text>
    <rect x="450" y="846" width="14" height="14" rx="3" fill="#FEF7E0" stroke="#E37400"/>
    <text x="470" y="858">持久核心</text>
    <rect x="540" y="846" width="14" height="14" rx="3" fill="#FCE8E6" stroke="#D93025"/>
    <text x="560" y="858">智能层（Python，借用）</text>
    <rect x="690" y="846" width="14" height="14" rx="3" fill="#F3E8FD" stroke="#9334E6"/>
    <text x="710" y="858">数据</text>
    <rect x="760" y="846" width="14" height="14" rx="3" fill="#F1F3F4" stroke="#5F6368"/>
    <text x="780" y="858">外部系统</text>
  </g>
</svg>
