# Chronotope 部署编排（单机自托管，mvp-架构设计 §4）
#
# 基础设施：postgres(pgvector) / restate / litellm / rustfs（S3 兼容存储）
# 应用服务：api / worker / executor / harness（make up 一键构建）
# web 控制台属 W4，放入 profile "web"（docker compose --profile web up web）
#
# 密钥纪律：模型 key 只在 litellm 容器与 .env 存在，事件日志零密钥。

name: chronotope

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chronotope}
      POSTGRES_USER: ${POSTGRES_USER:-chronotope}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chronotope_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次初始化自动执行契约 schema（内部建表均幂等）
      - ../internal/store/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chronotope} -d ${POSTGRES_DB:-chronotope}"]
      interval: 5s
      timeout: 3s
      retries: 10

  restate:
    image: docker.io/restatedev/restate:latest
    environment:
      RESTATE_AUTO_TIP: "false"
      # 固定节点名：数据卷跨容器重建时节点身份不变（否则 Restate 拒绝启动）
      RESTATE_NODE_NAME: chronotope-node
    volumes:
      - restatedata:/restate-data  # invocation/部署状态持久化（重启/重建不丢在途 run）
    ports:
      - "8081:8080" # ingress（worker 注册端点）
      - "9070:9070" # admin/observability

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-chronotope-dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]

  rustfs:
    # RustFS：Rust 实现、S3 兼容对象存储（MinIO 全面下线后的替换，
    # https://github.com/rustfs/rustfs）——架构整洁 C6：服务名统一
    image: ${RUSTFS_IMAGE:-rustfs/rustfs:1.0.1}
    environment:
      # RustFS S3 凭证须经 RUSTFS_ACCESS_KEY/RUSTFS_SECRET_KEY（MINIO_ROOT_*
      # 仅 admin 面板——容器日志实证「Access Key Id 不存在」）
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-chronotope}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-chronotope_dev}
      RUSTFS_ROOT_USER: ${RUSTFS_ROOT_USER:-rustfsadmin}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_ROOT_PASSWORD:-rustfsadmin}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # console
    volumes:
      - rustfsdata:/data
    healthcheck:
      # RustFS 无 /minio/health/live 兼容路径——S3 根任意 HTTP 响应即存活
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://localhost:9000/"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    environment:
      API_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-chronotope}:${POSTGRES_PASSWORD:-chronotope_dev}@postgres:5432/${POSTGRES_DB:-chronotope}?sslmode=disable
      RESTATE_URL: http://restate:8080
      HARNESS_URL: http://harness:8000 # 共享知识嵌入（期 3 §D——rkn 422 实证缺失）
      EXECUTOR_URL: http://executor:9082
      API_AGGREGATE_INTERVAL: ${API_AGGREGATE_INTERVAL:-1m}
      API_AUTH_MODE: ${API_AUTH_MODE:-off}
      API_ADMIN_KEY: ${API_ADMIN_KEY:-}
      OUTBOX_INTERVAL: ${OUTBOX_INTERVAL:-5s}
      OUTBOX_ALLOW_PRIVATE: ${OUTBOX_ALLOW_PRIVATE:-false}
      # 冷层归档（期 2 §B）：RustFS S3 + 年龄闸门（0 = 立即可归档）
      RUSTFS_ENDPOINT: rustfs:9000 # 容器内固定服务名（.env 的 localhost 是宿主观——见 503 实证）
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-chronotope}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-chronotope_dev}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-workspaces}
      ARCHIVE_MIN_AGE: ${ARCHIVE_MIN_AGE:-720h}
    extra_hosts:
      # Linux runner 无 host.docker.internal（macOS Docker Desktop 才有）——
      # 事件投递 e2e 的接收器跑在 runner 主机（GitHub CI 实证断言失败）
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      restate:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    environment:
      WORKER_ADDR: ":9080"
      DATABASE_URL: postgres://${POSTGRES_USER:-chronotope}:${POSTGRES_PASSWORD:-chronotope_dev}@postgres:5432/${POSTGRES_DB:-chronotope}?sslmode=disable
      RESTATE_URL: http://restate:8080
      EXECUTOR_URL: http://executor:9082
      API_AGGREGATE_INTERVAL: ${API_AGGREGATE_INTERVAL:-1m}
      API_AUTH_MODE: ${API_AUTH_MODE:-off}
      API_ADMIN_KEY: ${API_ADMIN_KEY:-}
      OUTBOX_INTERVAL: ${OUTBOX_INTERVAL:-5s}
      OUTBOX_ALLOW_PRIVATE: ${OUTBOX_ALLOW_PRIVATE:-false}
      HARNESS_URL: http://harness:8000
      CONSOLIDATE_THRESHOLD: ${CONSOLIDATE_THRESHOLD:-40}
    ports:
      - "9080:9080"
    depends_on:
      postgres:
        condition: service_healthy
      restate:
        condition: service_started
      harness:
        condition: service_started
      executor:
        condition: service_started

  executor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.executor
    environment:
      EXECUTOR_DRIVER: ${EXECUTOR_DRIVER:-docker}
      E2B_API_URL: ${E2B_API_URL:-}
      E2B_API_KEY: ${E2B_API_KEY:-}
      E2B_TEMPLATE: ${E2B_TEMPLATE:-}
      EXECUTOR_ADDR: ":9082"
      DATABASE_URL: postgres://${POSTGRES_USER:-chronotope}:${POSTGRES_PASSWORD:-chronotope_dev}@postgres:5432/${POSTGRES_DB:-chronotope}?sslmode=disable
      # 工作区 blob 合同（期 2 §A）：RustFS S3（内容寻址对象图）
      RUSTFS_ENDPOINT: rustfs:9000 # 容器内固定服务名（.env 的 localhost 是宿主观——见 503 实证）
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-chronotope}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-chronotope_dev}
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-workspaces}
    ports:
      - "9082:9082"
    volumes:
      # docker driver（dev）：executor 需要宿主机 docker 守护进程（受限容器）
      - /var/run/docker.sock:/var/run/docker.sock
      # 宿主工作区/快照目录共享（快照写宿主 /tmp——daemon 解析 -v 源；
      # 恢复读容器内 /tmp——CLI 解析 docker cp 源。命名空间错位 →
      # restore ENOENT 永久重试（真实 e2e 实证）——挂载后两侧一致）
      - ${CHRONOTOPE_WORKSPACES:-/tmp/chronotope-workspaces}:/tmp/chronotope-workspaces
      - ${CHRONOTOPE_SNAPSHOTS:-/tmp/chronotope-snapshots}:/tmp/chronotope-snapshots
    depends_on:
      postgres:
        condition: service_healthy # executor 启动即连库——未就绪会 fatal 退出（GitHub CI 实证 180s 超时）
      rustfs:
        condition: service_healthy

  harness:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.harness
    environment:
      HARNESS_PORT: "8000"
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY:-sk-chronotope-dev}
      # 1 = fake 模型流（无密钥 e2e/演示）；0 = 经 LiteLLM 网关调真实模型
      HARNESS_FAKE_MODEL: ${HARNESS_FAKE_MODEL:-0}
      HARNESS_FAKE_SCRIPT: ${HARNESS_FAKE_SCRIPT:-}
      HARNESS_FAKE_SCRIPT_ALT: ${HARNESS_FAKE_SCRIPT_ALT:-}
      HARNESS_FAKE_REPLY: ${HARNESS_FAKE_REPLY:-}
    ports:
      - "8000:8000"
    depends_on:
      - litellm

  web:
    profiles: ["web"] # W4 控制台：docker compose --profile web up --build web
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080} # 构建期注入（页面直连）
    ports:
      - "3000:3000"

volumes:
  pgdata: {}
  rustfsdata: {}
  restatedata: {}
