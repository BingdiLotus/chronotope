# LiteLLM 网关配置骨架（mvp-技术选型 §8.1）：
# 一个 OpenAI 兼容端点聚合所有模型；统一密钥/限流/fallback/用量计数。
# 密钥与厂商 Base URL 只在本文件引用的容器环境变量（.env）中存在——事件日志零密钥。
# Base URL 可指向官方端点或任意 OpenAI/Anthropic 兼容代理（网关层切换，0 代码改动）。
model_list:
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      api_base: os.environ/ANTHROPIC_BASE_URL
  - model_name: gpt-6-luna
    litellm_params:
      model: gpt-6-luna
      api_key: os.environ/OPENAI_API_KEY
      api_base: os.environ/OPENAI_BASE_URL

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
