# dsh runtime 的 cordis patch（批 4——用户指正：dsh 支持 openai 格式接口）。
# Custom model API（官方 docs/user/guide/providers.md）：openai-completions
# 协议 + baseURL 指 poke2api 代理 + OPENAI_API_KEY env——无需 DEEPSEEK key。
# 装配验证（2026-10-11 实证）：--dump-config 的 composed 树含本 provider +
# headless 真实 run（gpt-6.1-sol 经 poke2api——reasoning+回答完整）。
- id: llm-pi-ai
  config:
    providers:
      poke2api:
        apiKeyEnv: OPENAI_API_KEY
        api: openai-completions
        baseURL: https://www.poke2api.com/v1
        models:
          - id: gpt-6.1-sol
