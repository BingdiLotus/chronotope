openapi: 3.0.3
info:
  title: Chronotope Session API
  version: 1.1.0
  x-application-contract-version: 1.0.0
  x-contract-version-header: X-Chronotope-Application-Contract
  description: |
    Session API（契约规范 §2，权威定义见仓库根目录 契约规范.md）。
    当前开发代次允许破坏性变更，不提供旧协议兼容层；版本绑定在 run。
    应用 profile 使用不可变 agent、有限异步 run、固定应用工具 bridge 和单次 timer。
    认证启用时，所有资源查询/创建校验租户归属；应用 session 绑定 subject_ref/scope_id。

    状态机（唯一权威）：
      session: created → ready → running → sleeping / paused / awaiting_approval
               → completed → archived / deleted
      run:     queued → running → paused / awaiting_approval / frozen
               → completed / failed / canceled

    幂等键传递链路：Idempotency-Key(api) → run_id(worker) → (run_id, step)(harness/executor)。

    应用契约版本以 `x-application-contract-version` 声明，并随每个响应返回
    `X-Chronotope-Application-Contract`。错误响应必须同时包含 `error_code`、
    `category`、`retryable`；`error` 仅用于诊断，调用方不得解析其文本。
paths:
  /orgs/{orgId}/agents:
    post:
      summary: 幂等创建不可变 agent 配置快照
      operationId: createAgent
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "201": { description: agent 已创建，返回 id/config/spec_digest，version=1 }
        "200": { description: 同键同请求返回原 id/config/spec_digest，idempotent=true }
        "400": { description: 缺失或无效 Idempotency-Key }
        "403": { description: 租户归属不符 }
        "409": { description: 同键异请求，error_code=idempotency_conflict }
        "422": { $ref: "#/components/responses/Error422" }
  /agents/{agentId}/sessions:
    post:
      summary: 创建 session → ready（沙箱懒创建）
      operationId: createSession
      parameters:
        - $ref: "#/components/parameters/AgentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSessionRequest" }
      responses:
        "201": { description: session 已创建，返回 id/agent_id/status/subject_ref/scope_id }
        "200": { description: 同键同请求返回原 session，idempotent=true }
        "400": { description: 缺失或无效 Idempotency-Key }
        "403": { description: agent 租户归属不符 }
        "409": { description: 同键异请求或原 session 已删除 }
        "422": { description: 应用 session 缺少 subject_ref/scope_id，或请求非法 }
        "503": { description: 初始化尚未确认，必须用同 key 重试原资源 }
  /sessions/{sessionId}/runs:
    post:
      summary: 耐久接纳有限 run，返回稳定 handle；不等待模型或工具完成
      operationId: submitRun
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitRunRequest"
      responses:
        "202":
          description: run/command/admission outbox 已提交；返回 run_id/status=queued/idempotent=false
          headers:
            Location: { schema: { type: string }, description: "GET /runs/{runId}" }
        "200": { description: 同键同请求返回原 run_id 与 canonical status，idempotent=true；先于 busy/限流检查 }
        "400": { description: 缺失或无效 Idempotency-Key }
        "403": { description: session 租户归属不符 }
        "409": { description: 同键异完整请求冲突，或新请求遇 session busy（带 active_run_id）；由应用持久排队 }
        "422": { description: 请求非法，或应用 run 缺少绑定上下文/origin_command_id }
        "429": { description: 接纳限流，带 Retry-After }
  /runs/{runId}:
    get:
      summary: 受权查询 canonical run 状态与结果；无需保持 SSE 连接
      operationId: getRun
      parameters:
        - { name: runId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 终态和 final/error/usage 同一次提交后可见，未产生的结果字段为 null
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RunResult" }
        "403": { description: run 所属 session 的租户归属不符 }
        "404": { $ref: "#/components/responses/Error404" }
  /timers:
    post:
      summary: 耐久接纳一次性 timer，逻辑幂等键为 tenant_id/timer_id/revision
      operationId: createTimer
      description: |
        同键同规范请求返回原 handle，异 due_at/action/context 冲突。
        due_at 规范到 UTC 微秒精度。回调地址与服务认证只来自部署配置，
        由 tenant_id/subject_ref/scope_id 选择固定目标；请求不能提供 URL。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimerRequest" }
      responses:
        "202":
          description: timer 及待提交责任已持久化；同键重试仍返回原记录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimerRecord" }
          headers:
            Location: { schema: { type: string }, description: 含 tenant_id/subject_ref/scope_id/revision 的受权查询路径 }
        "400": { description: 标识/时间/revision 非法或存在未声明字段 }
        "403": { description: 租户不符或 subject/scope 未在部署配置中注册 }
        "409": { description: 同 timer 键复用了不同请求 }
  /timers/{timerId}:
    get:
      summary: 查询 timer 提交、回调接纳状态及最近错误
      operationId: getTimer
      parameters:
        - { name: timerId, in: path, required: true, schema: { type: string } }
        - { name: tenant_id, in: query, required: true, schema: { type: string } }
        - { name: subject_ref, in: query, required: true, schema: { type: string } }
        - { name: scope_id, in: query, required: true, schema: { type: string } }
        - { name: revision, in: query, required: true, schema: { type: integer, format: int64, minimum: 1 } }
      responses:
        "200":
          description: acknowledged 只证明应用耐久接纳 fire，不证明最终业务完成或送达
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimerRecord" }
        "400": { description: 缺少查询上下文或 revision 非法 }
        "403": { description: 租户不符 }
        "404": { description: timer 不存在或不属于该 subject/scope }
  /orgs/{orgId}/application-targets:
    post:
      summary: 注册或更新动态应用 bridge/timer target（仅平台 operator）
      operationId: upsertApplicationTarget
      description: |
        动态 target 不替代部署 env bootstrap。bridge 的 tenant/ref/url 路由不可变，
        凭据轮换只更新 token_env；timer target 的 url/subject/scope 变更会递增
        revision，并使旧 timer 在回调前 blocked 而不是改投新地址。
      parameters:
        - $ref: "#/components/parameters/OrgId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplicationTargetRequest" }
      responses:
        "201": { description: target 已创建；返回 revision/digest，不返回 token }
        "200": { description: target 已更新；revision+1 }
        "400": { description: 请求体非法或包含内联凭据 }
        "403": { description: 非平台 operator 或租户归属不符 }
        "409": { description: ref 与 static env 冲突、timer scope 冲突，或 bridge 路由字段被修改 }
        "422": { description: URL/subject/scope/token_env 校验失败 }
    get:
      summary: 列出当前租户的动态 target（不含凭据）
      operationId: listApplicationTargets
      parameters:
        - $ref: "#/components/parameters/OrgId"
      responses:
        "200": { description: target 列表（token_env 是引用名，不是 token） }
        "403": { description: 非平台 operator 或租户归属不符 }
  /orgs/{orgId}/application-targets/{kind}/{ref}:
    delete:
      summary: 撤销动态 target；旧 timer 将 blocked，不会改投
      operationId: deleteApplicationTarget
      parameters:
        - $ref: "#/components/parameters/OrgId"
        - { name: kind, in: path, required: true, schema: { type: string, enum: [bridge, timer] } }
        - { name: ref, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: target 已撤销并写入审计 }
        "403": { description: 非平台 operator 或租户归属不符 }
        "404": { description: target 不存在 }
  /sessions/{sessionId}/events:
    get:
      summary: SSE 时间轴；断线重连按 after=seq 续读；seq 允许 gap
      operationId: streamEvents
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - name: after
          in: query
          schema: { type: integer, format: int64 }
          description: 续读游标（含该 seq 之后的事件）
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: text/event-stream（事件行见 events.schema.json）
        "404": { $ref: "#/components/responses/Error404" }
  /sessions/{sessionId}:
    get:
      summary: Session 状态 + 最近事件
      operationId: getSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200": { description: session 状态与最近事件 }
        "404": { $ref: "#/components/responses/Error404" }
    delete:
      summary: 逻辑删除（tombstone 两段式：立即可见性移除 → 异步 compaction）
      operationId: deleteSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204": { description: tombstone 已生效 }
  /sessions/{sessionId}/actions:
    post:
      summary: 控制动作（幂等）
      operationId: sessionAction
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActionRequest"
      responses:
        "202": { description: 动作已受理 }
        "409": { description: 状态不合法 }
  /sessions/{sessionId}/messages:
    post:
      summary: 人类消息注入（群聊/steer；幂等）
      operationId: postMessage
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "202": { description: 已入队 }
  /sessions/{sessionId}/skills:
    post:
      summary: skill 安装（幂等；沙箱 skills/<name>/ 写入 + 指令 patch）
      operationId: installSkill
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "202": { description: skill.install 事件已产生 }
        "403": { description: 未批准 }
  /sessions/{sessionId}/mcp:
    post:
      summary: MCP 连接（幂等；tools/list 缓存进 session 状态）
      operationId: connectMCP
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "202": { description: mcp.connected 事件已产生 }
        "403": { description: 未批准 }
  /sessions/{sessionId}/export:
    get:
      summary: 导出（事件日志+工件+快照引用，标准 tar）
      operationId: exportSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200": { description: application/x-tar }

components:
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema: { type: string }
    AgentId:
      name: agentId
      in: path
      required: true
      schema: { type: string }
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 256 }

  responses:
    Error404:
      description: 不存在
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Error422:
      description: 语义非法（config 非法 / 超预算），不重试
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, error_code, error, category, retryable]
      properties:
        code: { type: integer, description: HTTP status（兼容旧字段） }
        error_code:
          type: string
          description: |
            稳定机器码；完整集合见 docs/contracts/application-contract.v1.json。
            常见值：invalid_request、unauthorized、tenant_mismatch、not_found、
            idempotency_conflict、session_busy、validation_failed、rate_limited、
            application_bridge_unavailable、timer_target_unavailable、internal_error。
          example: idempotency_conflict
        error: { type: string, description: 诊断文本；不得作为分支依据 }
        category:
          type: string
          enum: [validation, auth, not_found, conflict, rate_limit, provider, tool, timer, runtime, limit, policy, canceled]
        retryable:
          type: boolean
          description: |
            仅表示同一逻辑操作在稳定幂等键下可否安全重试；不表示 run 可恢复。
            session_busy / rate_limited / 5xx 可退避重试；idempotency_conflict 必须修正请求。
        detail: { type: string }
      description: |
        应用契约 v1.0.0 错误信封。输入/权限 4xx 不盲目重试；409 idempotency_conflict
        必须修正逻辑请求；session_busy 由应用持久排队后重试；429/5xx 幂等退避重试。
    AgentConfig:
      type: object
      required: [model]
      properties:
        model: { type: string, description: model+版本 }
        instructions: { type: string }
        tools: { type: array, items: { type: string }, description: 旧 executor 工具；application_profile 不暴露此通道 }
        mcp_servers: { type: array, items: { type: string } }
        skills: { type: array, items: { type: string } }
        environment:
          type: object
          properties:
            sandbox:
              type: object
              properties:
                image: { type: string }
                limits: { type: object, additionalProperties: { type: string } }
                ttl: { type: string }
        budget: { type: object }
        version: { type: integer, description: 当前不可变创建规范为 1；配置变更应创建新快照 }
        application_profile:
          type: boolean
          default: false
          description: true 时只暴露固定应用工具，关闭 tenant knowledge 注入、自动 consolidation 和旧 SDK/MCP/executor 入口
        application_bridge_ref:
          type: string
          description: 必须指向部署中归属本 tenant 的 bridge；不接收 URL 或凭据
        application_tools:
          type: array
          items: { $ref: "#/components/schemas/ApplicationTool" }
        max_output_tokens: { type: integer, minimum: 0, description: 每次模型输出上限；0 使用默认 4096 }
        max_steps: { type: integer, minimum: 0, description: 有限 run 的模型派发上限；0 使用默认 16 }
        max_duration_ms: { type: integer, format: int64, minimum: 0, description: run deadline；0 使用默认 300000ms }
    ApplicationTool:
      type: object
      required: [model_alias, tool_ref, description, input_schema]
      properties:
        model_alias: { type: string, pattern: "^[a-zA-Z0-9_-]{1,64}$" }
        tool_ref: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        input_schema:
          type: object
          description: 有效 JSON Schema，顶层 type=object；只接受本地 $ref；alias/ref 均不能重复
    ApplicationToolCall:
      type: object
      required: [context, tool_ref, arguments]
      description: |
        Worker POST 到受信 bridge target（静态 env 或动态注册）；Bearer 服务认证来自 token_env，
        Idempotency-Key 为稳定 operation_id。应用验证主体、scope 及参数，
        持久保存业务写入和原返回值；2xx/4xx JSON 都可作为原 call 的工具结果回喂。
      properties:
        context:
          type: object
          required: [tenant_id, subject_ref, scope_id, origin_command_id, run_id, operation_id, tool_call_id]
          description: 全部从 bound run/工具调用派生，不能由模型 arguments 提供
          properties:
            tenant_id: { type: string }
            subject_ref: { type: string }
            scope_id: { type: string }
            origin_command_id: { type: string }
            run_id: { type: string }
            operation_id: { type: string }
            tool_call_id: { type: string }
        tool_ref: { type: string }
        arguments: { type: object }
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [name, config]
      properties:
        name: { type: string }
        config: { $ref: "#/components/schemas/AgentConfig" }
    SubmitRunRequest:
      type: object
      additionalProperties: false
      required: [input]
      properties:
        input: { type: string }
        trigger: { type: object }
        topic: { type: string }
        origin_command_id: { type: string, description: 应用 profile 必填，作为 opaque 来源引用绑定到 run }
      description: 幂等摘要包括完整 input/topic/trigger/origin_command_id；模型参数和 metadata 不授予访问权
    CreateSessionRequest:
      type: object
      additionalProperties: false
      properties:
        subject_ref: { type: string, description: 应用 profile 必填的 opaque 主体引用 }
        scope_id: { type: string, description: 应用 profile 必填的 opaque 作用域引用 }
        participants:
          type: array
          description: 应用 profile 不接受群聊 participants
          items:
            type: object
            required: [agent_id]
            properties:
              agent_id: { type: string }
              role: { type: string }
    RunResult:
      type: object
      required: [run_id, session_id, status, final, error, usage, bound]
      properties:
        run_id: { type: string }
        session_id: { type: string }
        status: { type: string, enum: [queued, running, paused, awaiting_approval, frozen, completed, failed, canceled] }
        final: { type: string, nullable: true }
        error:
          allOf: [{ $ref: "#/components/schemas/RunError" }]
          nullable: true
        usage:
          type: object
          nullable: true
          properties:
            tokens_in: { type: integer, format: int64 }
            tokens_out: { type: integer, format: int64 }
            tokens_total: { type: integer, format: int64 }
            usage_unknown: { type: boolean, description: 仅计量未知；不把已知模型结果当作 result_unknown 重做 }
        bound: { type: object, description: 不可变 agent/config/protocol/model、application_contract_version 与 tenant/subject/scope/origin 引用 }
        steps: { type: integer }
        truncated: { type: boolean }
    RunError:
      type: object
      required: [code, message, category, retryable]
      properties:
        code: { type: string, description: 稳定 run 错误码 }
        message: { type: string, description: 诊断文本 }
        category:
          type: string
          enum: [validation, auth, not_found, conflict, rate_limit, provider, tool, timer, runtime, limit, policy, canceled]
        retryable:
          type: boolean
          description: 仅当没有已发生的外部工具效果且可安全重提同一逻辑操作时为 true
    TimerRequest:
      type: object
      additionalProperties: false
      required: [tenant_id, subject_ref, scope_id, timer_id, revision, due_at, opaque_action_ref]
      properties:
        tenant_id: { type: string, minLength: 1, maxLength: 256 }
        subject_ref: { type: string, minLength: 1, maxLength: 256 }
        scope_id: { type: string, minLength: 1, maxLength: 256 }
        timer_id: { type: string, minLength: 1, maxLength: 256 }
        revision: { type: integer, format: int64, minimum: 1 }
        due_at: { type: string, format: date-time, description: 绝对时间；过期立即触发，不周期请求模型 }
        opaque_action_ref: { type: string, minLength: 1, maxLength: 2048 }
    TimerRecord:
      type: object
      required: [tenant_id, subject_ref, scope_id, timer_id, revision, due_at, opaque_action_ref, timer_handle, fire_id, state]
      properties:
        tenant_id: { type: string }
        subject_ref: { type: string }
        scope_id: { type: string }
        timer_id: { type: string }
        revision: { type: integer, format: int64 }
        due_at: { type: string, format: date-time }
        opaque_action_ref: { type: string }
        timer_handle: { type: string }
        fire_id: { type: string, description: 重投保持同一身份 }
        state: { type: string, enum: [pending, scheduled, firing, retrying, blocked, acknowledged] }
        submit_attempts: { type: integer }
        callback_attempts: { type: integer }
        last_error: { type: string, description: 诊断文本 }
        last_error_code:
          type: string
          description: 稳定 timer 错误码；blocked/retrying 的机器可读原因
        created_at: { type: string, format: date-time }
        submitted_at: { type: string, format: date-time, nullable: true }
        acknowledged_at: { type: string, format: date-time, nullable: true }
    TimerFire:
      type: object
      required: [tenant_id, timer_id, revision, fire_id, opaque_action_ref]
      description: |
        Worker POST 到冻结的 timer target（静态 env 或动态注册，digest fencing）；
        Bearer 服务认证与 Idempotency-Key=fire_id。
        只有应用耐久接纳后才返回 2xx；网络/响应未知可重投同一 payload/fire_id。
        这一跳的 ACK 不证明最终发送或应用动作完成，改期/取消由应用检查 revision/status。
      properties:
        tenant_id: { type: string }
        timer_id: { type: string }
        revision: { type: integer, format: int64 }
        fire_id: { type: string }
        opaque_action_ref: { type: string }
    ApplicationTargetRequest:
      type: object
      additionalProperties: false
      required: [kind, ref, url, token_env]
      properties:
        kind: { type: string, enum: [bridge, timer] }
        ref: { type: string, minLength: 1, maxLength: 256 }
        url: { type: string, format: uri, description: bridge URL 或 timer callback URL；必须 http(s) }
        subject_ref: { type: string, description: "timer target 必填；bridge 禁止", maxLength: 256 }
        scope_id: { type: string, description: "timer target 必填；bridge 禁止", maxLength: 256 }
        token_env: { type: string, description: 服务凭据环境变量名；不接受内联 token }
    ApplicationTarget:
      type: object
      required: [kind, ref, tenant_id, url, token_env, revision, state, digest, updated_at]
      properties:
        kind: { type: string, enum: [bridge, timer] }
        ref: { type: string }
        tenant_id: { type: string }
        url: { type: string }
        subject_ref: { type: string }
        scope_id: { type: string }
        token_env: { type: string, description: 引用名，不含 token 值 }
        revision: { type: integer, format: int64 }
        state: { type: string, enum: [active] }
        digest: { type: string, description: 路由摘要；timer 冻结此值用于 fencing }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ActionRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [pause, resume, wake, cancel, steer]
        payload: { type: object }
