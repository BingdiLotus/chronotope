name: ci

on:
  push:
  pull_request:

jobs:
  go:
    name: go（build / vet / 契约测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test（含 test/contract 契约测试）
        run: go test ./...

  harness:
    name: harness（/runs 契约测试）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: sync
        run: uv sync --frozen
      - name: test
        run: uv run pytest -q

  spike:
    name: spike（Restate Go SDK 五项原语，独立 module）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x" # sdk-go v1.1.0 要求
      - name: build（GOWORK=off，spike 为独立模块）
        run: GOWORK=off go build ./...

  e2e:
    name: e2e（compose 全链路 W1 闭环，fake 模型无密钥）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 启动全栈（api/worker/harness/executor + postgres/restate/minio/litellm）
        run: |
          HARNESS_FAKE_MODEL=1 docker compose -f deploy/docker-compose.yml up -d --build postgres restate litellm harness worker api
      - name: 等待 api 就绪
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8080/healthz > /dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://localhost:8080/healthz
      - name: 注册 worker 端点到 Restate
        run: |
          curl -fsS -X POST http://localhost:9070/deployments -H 'content-type: application/json' \
            -d '{"uri":"http://worker:9080","version":"v1","use_http_11":true,"force":true}'
      - name: W1 闭环 e2e
        run: bash test/e2e/w1-loop.sh http://localhost:8080
      - name: 容器日志（失败时诊断）
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=100

  # TODO(W3+)：golden journal 重放测试
  # TODO(W3)：chaos 套件（kill -9 矩阵）在专用 runner 上执行
