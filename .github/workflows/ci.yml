name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_real:
        description: 真实模型应用执行门禁（需 ANTHROPIC_API_KEY；不验证 E2B 或 Slack）
        type: boolean
        default: false
      run_legacy:
        description: 历史全场景诊断（未适配当前合同，可能失败；非当前门禁）
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  go:
    name: go（build / vet / 单测+集成测试）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: chronotope_test
          POSTGRES_USER: chronotope
          POSTGRES_PASSWORD: chronotope_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chronotope"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      - name: test（单测 + 独立 PG 集成 + golden journal 重放）
        env:
          STORE_TEST_DATABASE_URL: postgres://chronotope:chronotope_dev@localhost:5432/chronotope_test?sslmode=disable
        run: go test ./...

  harness:
    name: harness（单段推理/工具协议）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: harness
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: sync
        run: uv sync --frozen
      - name: test
        run: uv run pytest -q

  spike:
    name: spike（Restate Go SDK 原语，独立 module）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: spike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: spike/go.sum
      - name: build
        run: GOWORK=off go build ./...
      - name: test
        run: GOWORK=off go test ./...

  e2e:
    name: e2e（W1 202/GET + application runtime，fake HTTP 模型）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 当前完整 fake 门禁（保留卷验证恢复）
        env:
          E2E_STATE_DIR: ${{ runner.temp }}/application-runtime-fake
        run: bash scripts/demo.sh
      - name: 容器日志（失败诊断）
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=150
      - name: 保存应用门禁报告与 fixture 证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-runtime-fake
          path: |
            ${{ runner.temp }}/application-runtime-fake/report.json
            ${{ runner.temp }}/application-runtime-fake/fixture.log
          if-no-files-found: warn
      - name: 清理当前 runner 容器
        if: always()
        run: docker compose -f deploy/docker-compose.yml down --remove-orphans

  real:
    name: real（手动、真实模型应用门禁；不含 E2B/Slack）
    if: github.event_name == 'workflow_dispatch' && inputs.run_real
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL || 'https://api.anthropic.com' }}
      EXECUTOR_DRIVER: docker
    steps:
      - uses: actions/checkout@v4
      - name: 检查明确请求的真实模型凭据
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo '::error::run_real requires ANTHROPIC_API_KEY; a skipped provider is not a passing real-model gate'
            exit 1
          fi
      - name: 真实模型工具回喂与 durable timer 恢复
        run: python3 test/e2e/application-runtime.py --mode real --state-dir "$RUNNER_TEMP/application-runtime-real"
      - name: 容器日志（失败诊断）
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=150
      - name: 保存真实模型门禁报告与 fixture 证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-runtime-real
          path: |
            ${{ runner.temp }}/application-runtime-real/report.json
            ${{ runner.temp }}/application-runtime-real/fixture.log
          if-no-files-found: warn
      - name: 清理当前 runner 容器
        if: always()
        run: docker compose -f deploy/docker-compose.yml down --remove-orphans

  legacy:
    name: legacy（手动诊断、未适配当前合同；非本期证据）
    if: github.event_name == 'workflow_dispatch' && inputs.run_legacy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 历史场景（保留原断言，失败正常标红）
        run: |
          echo '::warning::Legacy scenarios are not adapted to current creation keys, asynchronous runs, and tool aliases. This job is diagnostic, not current C0-C3 evidence.'
          bash scripts/demo-legacy.sh
      - name: 容器日志（失败诊断）
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=150
      - name: 清理当前 runner 容器
        if: always()
        run: docker compose -f deploy/docker-compose.yml down --remove-orphans
